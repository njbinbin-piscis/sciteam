# `heldout-progress` arm: the `heldout` arm plus a no-progress stop (docs/40 §5, docs/60 D11):
# after 3 identical held-out failures on a task, approval through this route is refused.
validators:
  acceptance:
    command: "{task.acceptance}"
    timeout_s: 1800
  heldout:
    command: "python /audit/check.py"
    timeout_s: 3600

requirements:
  - name: work-has-predicate
    act: task_create
    require: [{field: acceptance}]
  - name: work-validated
    act: task_transition
    transition: submit
    require: [{validate: [acceptance]}]
  - name: four-eyes
    act: task_transition
    transition: approve
    require: [{distinct: [actor, task.assignee]},
              {progress: {validator: heldout, identical_failures: 3}}, {validate: [heldout]}]

facts:
  - name: accepted
    subject: task
    when: {event: task_status_changed, to: done}
    require: [{validated: acceptance}]
    revoke_when: {event: task_status_changed, transition: reopen}
