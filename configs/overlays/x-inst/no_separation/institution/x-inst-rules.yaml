# X-inst `no_separation`: mechanical check kept, the implementer reviews its own work.
validators:
  acceptance:
    command: "{task.acceptance}"
    timeout_s: 1800

requirements:
  - name: work-has-predicate
    act: task_create
    require: [{field: acceptance}]
  - name: work-validated
    act: task_transition
    transition: submit
    require: [{validate: [acceptance]}]

facts:
  - name: accepted
    subject: task
    when: {event: task_status_changed, to: done}
    require: [{validated: acceptance}]
    revoke_when: {event: task_status_changed, transition: reopen}
