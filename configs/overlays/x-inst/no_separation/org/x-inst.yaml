# X-inst `no_separation`: a single seat that implements and reviews.
mission: |
  Deliver the owner's goal (the root task labelled `goal`) so that it passes the owner's hidden
  acceptance suite.
default_harness: harness/team-institution.yaml
staffing: "kind:human"
seats:
  - name: implementer
    count: 1
    charter: |
      Implement the goal task. Write your own tests under /testbed/team_tests; the goal's
      acceptance command runs them. You are also its reviewer: approve it when you have checked
      it against the documentation, otherwise reject it and keep working.
goals: {label: goal, fact: accepted}
