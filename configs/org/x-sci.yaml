# X-inst-confirm fixed organization on SciCode: no hiring, no amendments (docs/60 §6.4).
mission: |
  Deliver the owner's goal (the root task labelled `goal`): every function in
  /workspace/solution.py numerically correct against reference values the team cannot see.
default_harness: harness/team-institution.yaml
staffing: "kind:human"
seats:
  - name: implementer
    count: 1
    charter: |
      Implement the goal task in /workspace/solution.py. Write your own tests under
      /workspace/team_tests; the goal's acceptance command runs them. Submit for review when
      you believe the work is complete.
  - name: auditor
    count: 1
    charter: |
      Review the goal task independently of the implementer. Before approving, check the work
      yourself and extend /workspace/team_tests with your own tests; reject with concrete
      reasons when anything is missing or wrong.
goals: {label: goal, fact: accepted}
