# Adopt as the communication policy by amendment (path comm/genesis.yaml).
name: workflow
description: 'Fixed workflow (DAG). Agents do not talk to each other: no private messages, no rooms, no
  mentions. The tasks and their dependencies are defined up front; you are woken when a task is assigned
  to you, becomes ready, needs your review or is sent back. Write what the next step needs in the task''s
  discussion and in the submitted artifacts. You may message the human owner if you are blocked.'
rules:
- name: human-any
  act: post_message
  via: dm
  from: kind:human
  to: '*'
- name: to-human
  act: post_message
  via: dm
  from: '*'
  to: human
- name: task-notes
  act: post_message
  via: task
  from: task.party
- name: mention-human
  act: mention
  from: '*'
  to: human
- name: human-mention
  act: mention
  from: kind:human
  to: '*'
- name: work
  act: task_transition
  transition: start|block|unblock|submit
  from: task.assignee
- name: review
  act: task_transition
  transition: approve|reject
  from: task.reviewer
- name: plan-tasks
  act: task_create
  from: role:planner | kind:human
- name: plan-edit
  act: task_update
  from: role:planner | kind:human
- name: plan-assign
  act: task_transition
  transition: assign
  from: role:planner | kind:human
  to: '*'
- name: owner
  act: task_transition
  transition: reopen|cancel|unassign
  from: role:planner | kind:human
- name: to-planner
  act: post_message
  via: dm
  from: '*'
  to: role:planner
- name: planner-dm
  act: post_message
  via: dm
  from: role:planner
  to: '*'
- name: hire
  act: hire
  from: group:staffing
- name: dismiss
  act: dismiss
  from: group:staffing
- name: certify
  act: certify_environment
  from: group:engineering
- name: revoke
  act: revoke_environment
  from: group:engineering
- name: org-seats-dm
  act: post_message
  via: dm
  from: role:founder | role:hr | role:engineer
  to: '*'
- name: to-org-seats
  act: post_message
  via: dm
  from: '*'
  to: role:founder | role:hr | role:engineer | human
- name: org-seats-mention
  act: mention
  from: role:founder | role:hr | role:engineer
  to: '*'
- name: mention-org-seats
  act: mention
  from: '*'
  to: role:founder | role:hr | role:engineer | human
wake_on:
- task_assigned
- task_ready
- task_review
- task_returned
- timer
- dm
limits:
  message_chars: 8000
  messages_per_agent_per_min: 12
  messages_per_pair_per_10min: 40
