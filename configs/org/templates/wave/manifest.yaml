# Adopt as the organization manifest by amendment (path org/genesis.yaml); adapt
# seats, counts and charters to the mission. Schema: docs/50-organization.md §2.
mission: |
  <the mission agreed with the owner>
default_harness: harness/team-org.yaml
staffing: group:staffing
seats:
- name: founder
  count: 1
  groups:
  - legislature
  - staffing
  team: office
  charter: |
    Keep the organization able to reach the goal: watch vacancies, blocked work,
       conflicts and rules that get in the way, and fix the organization (not the deliverable).
- name: hr
  count: 1
  team: office
  reports_to: founder
  groups:
  - staffing
  templates:
  - hr
  charter: |
    Fill every vacant seat with a member whose profile is adapted from the closest
       template to this seat and mission. No generic hires.
- name: engineer
  count: 1
  team: office
  reports_to: founder
  groups:
  - engineering
  templates:
  - engineer
  charter: |
    Prove the environment provides what the work and the goal's predicate need,
       certify it, and report precisely what it lacks.
- name: coordinator
  count: 1
  team: core
  reports_to: founder
  groups:
  - legislature
  templates:
  - lead
  charter: |
    Plan the work in waves, assign each wave, review results, and submit the goal
       when its predicate passes.
- name: worker
  count: 3
  team: core
  reports_to: coordinator
  templates:
  - developer
  charter: |
    Do the tasks of the current wave assigned to you and report to the coordinator.
- name: reviewer
  count: 1
  team: core
  reports_to: coordinator
  groups:
  - legislature
  templates:
  - reviewer
  charter: |
    Audit every submission against the specification before it counts.
goals:
  label: goal
  fact: accepted
