# Source: https://api-docs.deepseek.com/quick_start/pricing and GET /models (checked 2026-09-23).
deepseek-flash:
  provider: openai_compat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  wire_model: deepseek-flash
  context_window: 1048576
  max_output_tokens: 393216
  reasoning:
    supported: true
    efforts: [low, high, max]
    default_effort: max
    passback_with_tools: true
  pricing_usd_per_mtok:
    peak: {cache_hit: 0.006, cache_miss: 0.30, output: 1.20}
    off_peak: {cache_hit: 0.003, cache_miss: 0.15, output: 0.60}
  peak_hours_utc: ["01:00-04:00", "06:00-10:00"]
  peak_weekdays_only: true
  concurrency_limit: 2500
  forced_tool_choice: false   # thinking mode rejects required/named tool_choice (probed 2026-09-23)

deepseek-v4-pro:
  provider: openai_compat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  wire_model: deepseek-v4-pro
  context_window: 1048576
  max_output_tokens: 393216
  reasoning:
    supported: true
    efforts: [low, high, max]
    default_effort: max
    passback_with_tools: true
  pricing_usd_per_mtok:
    peak: {cache_hit: 0.044, cache_miss: 1.32, output: 3.96}
    off_peak: {cache_hit: 0.022, cache_miss: 0.66, output: 1.98}
  peak_hours_utc: ["01:00-04:00", "06:00-10:00"]
  peak_weekdays_only: true
  concurrency_limit: 500
  forced_tool_choice: false
