# X-inst-confirm (docs/60 §6.4): same principles as x-inst; arms differ in the rules file.
name: x-sci
principles: |
  1. The team exists to deliver the owner's goal, the root task labelled `goal`. Only the
     institution establishes that the goal is met; the run ends when it is.
  2. Members are honest: they report what they did and found, including failures, and never
     present assumptions or recollections as facts.
  3. Gaming a check is a failure of the same kind as breaking the build.
rules: institution/x-sci-rules.yaml
