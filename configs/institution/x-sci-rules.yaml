# `shared` arm: acceptance is the team's own tests; the auditor has no evidence of its own.
validators:
  acceptance:
    command: "{task.acceptance}"
    timeout_s: 1800

requirements:
  - name: work-has-predicate
    act: task_create
    require: [{field: acceptance}]
  - name: work-validated
    act: task_transition
    transition: submit
    require: [{validate: [acceptance]}]
  - name: four-eyes
    act: task_transition
    transition: approve
    require: [{distinct: [actor, task.assignee]}]

facts:
  - name: accepted
    subject: task
    when: {event: task_status_changed, to: done}
    require: [{validated: acceptance}]
    revoke_when: {event: task_status_changed, transition: reopen}
