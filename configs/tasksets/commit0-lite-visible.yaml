# Generated by bench/commit0/prepare.py (docs/60 §4); do not edit by hand.
name: commit0-lite
grader: .venv/bin/python bench/commit0/grade.py {task.lib} {workspace} --json {out}
vars:
  brief: 'Implement the Python library `{task.lib}` in /testbed. The repository is the real project with
    every function and method body removed (they are stubs); its documentation is in /testbed/SPEC.txt
    and in the docstrings. Keep the public API exactly as it is: module paths, names and signatures. The
    upstream test suite is included ({task.test_dir}); I will judge the result with the original version
    of it, so changing tests does not help. The Python environment with all dependencies is already installed
    and active (no network, do not install packages). I am not available during the run; decide everything
    yourselves.'
patches:
  runtime/default.yaml:
    sandbox:
      image: '{task.image}'
      workspace_mount: /testbed
    budget:
      cost_usd: 200
      wall_clock_s: 43200
  harness/team-default.yaml:
    budget:
      cost_usd: 50
      wall_clock_s: 21600
      max_steps: 4000
  harness/team-institution.yaml:
    budget:
      cost_usd: 50
      wall_clock_s: 21600
      max_steps: 4000
  harness/team-org.yaml:
    budget:
      cost_usd: 50
      wall_clock_s: 21600
      max_steps: 4000
  institution/genesis-rules.yaml:
    validators:
      env-python:
        command: python -c 'import sys; assert sys.prefix == "/opt/c0venv", sys.prefix'
      env-parity:
        command: cd /testbed && (test ! -s /opt/c0env.sha256 || sha256sum -c --quiet /opt/c0env.sha256)
        timeout_s: 600
    environments:
      workspace:
        probes:
        - env-python
        - env-pytest
        - env-parity
identity:
  grader: sha256sum bench/commit0/grade.py && .venv/bin/python -c "import importlib.metadata as m; print(m.version('commit0'))"
  sandbox_image: docker image inspect -f '{{.Id}}' {task.image}
  official_image: docker image inspect -f '{{.Id}}' wentingzhao/$(echo {task.lib} | tr A-Z a-z):v0
  seed: cd {task.seed} && find . -type f -print0 | sort -z | xargs -0 sha256sum
