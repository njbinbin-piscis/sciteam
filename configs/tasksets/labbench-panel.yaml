name: labbench-panel
grader: .venv/bin/python bench/labbench/grade.py {task.item} {workspace} --json {out}
vars:
  brief: 'Answer the multiple-choice question in /workspace/PROBLEM.md. Write only the letter of your
    chosen option to /workspace/ANSWER.txt (for example: C). If the information given is not enough to
    decide, choose the option that says so; a wrong answer is worse than admitting that. You may compute
    with Python (numpy, scipy, sympy are installed; no network, do not install packages). I am not available
    during the run; decide everything yourselves.'
patches:
  runtime/default.yaml:
    sandbox:
      image: sciteam-sci:v0
    budget:
      cost_usd: 20
      wall_clock_s: 3600
  harness/team-default.yaml:
