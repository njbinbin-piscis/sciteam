# X-evid (docs/60 §6.6, §6.8, D18): two independent implementers and an auditor, with double-blind
# separation of implementation (`submit` -> `present`) and cross-comparison (`approve` -> `agree`).
name: x-evid
comm_policy: comm/x-evid.yaml
institution: institution/x-evid.yaml
runtime: runtime/x-evid.yaml
workspace_seed: "{task.seed}"
members:
- {id: impl1, role: implementer, harness: harness/team-institution.yaml, profile_ref: profiles/xevid-impl1.md, attrs: {workspace_access: ro}}
- {id: impl2, role: implementer, harness: harness/team-xevid-b.yaml, profile_ref: profiles/xevid-impl2.md, attrs: {workspace_access: ro}}
- {id: auditor, role: auditor, harness: harness/team-institution.yaml, profile_ref: profiles/xevid-auditor.md, attrs: {workspace_access: ro, memory_activations: "0"}}
- {id: owner, kind: human, role: owner}
tasks:
- key: goal-1
  by: owner
  title: "Deliver your solution to the problem in PROBLEM.md"
  labels: [goal]
  assignee: impl1
  reviewer: auditor
- key: goal-2
  by: owner
  title: "Deliver your solution to the problem in PROBLEM.md"
  labels: [goal]
  assignee: impl2
  reviewer: auditor
kickoff:
- by: owner
  to: '@impl1'
  text: "Read /workspace/PROBLEM.md. Your goal task is your solution; it is accepted only when it agrees with the other implementer's."
- by: owner
  to: '@impl2'
  text: "Read /workspace/PROBLEM.md. Your goal task is your solution; it is accepted only when it agrees with the other implementer's."
