name: market
description: >-
  Claim market. Nobody assigns work: tasks are posted open and any worker may claim one that
  is ready. Anyone may post tasks (including follow-ups they discover) and talk in #market;
  private messages are allowed. Claim one task at a time and finish it before claiming the
  next.
rules:
  - {name: dm, act: post_message, via: dm, from: "*", to: "*"}
  - {name: rooms, act: post_message, via: "room|task", from: "*"}
  - {name: mention, act: mention, from: "*", to: "*"}
  - {name: create-task, act: task_create, from: "*"}
  - {name: edit-task, act: task_update, from: "task.creator | kind:human"}
  - {name: claim, act: task_transition, transition: claim, from: "kind:agent"}
  - {name: work, act: task_transition, transition: "start|block|unblock|submit|unassign", from: "task.assignee"}
  - {name: review, act: task_transition, transition: "approve|reject", from: "task.reviewer"}
  - {name: owner, act: task_transition, transition: "reopen|cancel", from: "task.creator | kind:human"}
rooms:
  - {name: market, members: "*", topic: "task market"}
wake_on: [dm, mention, thread_reply, task_open, task_ready, task_review, task_returned, timer]
limits:
  message_chars: 8000
  messages_per_agent_per_min: 12
  messages_per_pair_per_10min: 40
