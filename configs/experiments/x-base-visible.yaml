# X-base (docs/60 §10 step 2): single agent on Commit0 lite with the upstream tests visible (official protocol) —
# comparable to published Commit0 lite numbers (OpenHands 42.95%, 2024).
name: x-base-visible
hypothesis: >-
  Descriptive, no directional hypothesis: per-library pass rates of one flash agent with the
  upstream tests, against published results; the gap to x-base-hidden measures what hiding costs.
primary: score
# minitorch excluded: its reference scores 0.065 (bench/commit0/calibration.json; 60 §4 rule)
only_tasks: ["babel", "cachetools", "chardet", "cookiecutter", "deprecated", "imapclient", "jinja", "marshmallow", "parsel", "portalocker", "pyjwt", "simpy", "tinydb", "voluptuous", "wcwidth"]
tasks: tasksets/commit0-lite-visible.yaml
repeats: 2
parallel: 8
arms:
- {name: single, team: teams/x-single.yaml}
owner:
  mode: auto-approve
  nudges: 0
  nudge_text: "-"
  max_rounds: 5
audit: .venv/bin/python bench/team/check.py {run} --json {out}
