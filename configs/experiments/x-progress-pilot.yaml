# Pilot for the no-progress stop (docs/60 D11): mechanics only, no inference. The five problems
# where the x-inst-confirm `heldout` arm looped most; same team, model and held-out evidence.
name: x-progress-pilot
hypothesis: >-
  Descriptive pilot. Expect (a) budget-breaker endings far below the 36/40 of the heldout arm on
  these problems, (b) runs ending by goal_met or quiescent soon after the third identical
  held-out failure, (c) lower cost per run. If teams keep looping by other routes after the
  refusal, the rule is insufficient and must be redesigned before X-evid.
primary: score
success: 1.0
tasks: tasksets/scicode-verified.yaml
only_tasks: [p21, p55, p73, p79, p80]
repeats: 2
parallel: 10
arms:
- name: heldout-progress
  team: teams/x-sci.yaml
  overlay: overlays/x-sci/heldout-progress
  patches:
    runtime/default.yaml:
      sandbox:
        validator_mounts: ["bench/scicode/audit/{task.pid}:/audit:ro"]
    harness/team-institution.yaml: {model: mimo-v2.6-flash}
owner:
  mode: auto-approve
  nudges: 0
  nudge_text: "-"
  max_rounds: 8
audit: .venv/bin/python bench/team/check.py {run} --json {out}
