# X-evid (docs/60 §6.6 v2): can two independent solutions, compared by a validator, produce evidence
# that catches errors? DRAFT: not registered and not runnable until the seven-question review (§2)
# is passed and the registration is written in docs/60 §6.6. Changing this file after registration
# makes a new experiment.
name: x-evid
hypothesis: >-
  Primary: the answer-level score (0 when the question is not closed). Predicted ordering
  (pre-registered): replicate-cross >= replicate-same > compute-control, SESOI 0.05 on the paired
  mean difference. Secondary: closed rate, and accuracy among closed runs (precision of the gate).
primary: score
success: 1.0
tasks: tasksets/xevid-scicode.yaml
only_tasks:
- p8
- p12
- p13
- p14
- p21
- p22
- p24
- p26
- p27
- p28
- p32
- p33
- p37
- p39
- p43
- p48
- p50
- p55
- p63
- p73
- p74
- p76
- p79
- p80
repeats: 8
parallel: 4
arms:
- name: replicate-same
  team: teams/x-evid.yaml
  patches:
    runtime/x-evid.yaml:
      sandbox:
        validator_mounts: ["bench/xevid/agree.py:/xevid/agree.py:ro", "bench/xevid/bundles/{task.pid}:/xevid/bundle:ro"]
- name: replicate-cross
  team: teams/x-evid.yaml
  patches:
    runtime/x-evid.yaml:
      sandbox:
        validator_mounts: ["bench/xevid/agree.py:/xevid/agree.py:ro", "bench/xevid/bundles/{task.pid}:/xevid/bundle:ro"]
    harness/team-xevid-b.yaml: {model: mimo-v2.6-flash}
- name: compute-control
  team: teams/x-evid-control.yaml
owner:
  mode: auto-approve
  nudges: 0
  nudge_text: "-"
  max_rounds: 8
audit: .venv/bin/python bench/team/check.py {run} --json {out}
