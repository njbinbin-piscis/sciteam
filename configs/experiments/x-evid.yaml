# X-evid (docs/60 §6.6 v2, registered 2026-10-17, interpreter_digest: 3511c17957b56c214b9336b37eace773ae8f51ea9df43cfb59b5b40d35c8fbd3):
# Can two double-blind independent implementations, compared by an institutional validator on auditor
# approval (with at most 1 blind self-check round before honest cancellation), generate internal
# evidence that catches errors beyond compute-control? Changing this file after registration makes a
# new experiment.
name: x-evid
hypothesis: >-
  Decision metric (docs/60 section 6.6 registration): precision = P(score >= 1 | closed); the two
  replicate arms are predicted to exceed compute-control by >= 0.10 (SESOI). Net score (0 when not
  closed) and closed rate are reported alongside; `primary: score` only feeds the runner report.
primary: score
success: 1.0
tasks: tasksets/xevid-scicode.yaml
only_tasks:
- p8
- p12
- p13
- p14
- p21
- p22
- p24
- p26
- p27
- p28
- p32
- p33
- p37
- p39
- p43
- p48
- p50
- p55
- p63
- p73
- p74
- p76
- p79
- p80
repeats: 6
parallel: 10
arms:
- name: replicate-same
  team: teams/x-evid.yaml
  patches:
    runtime/x-evid.yaml:
      sandbox:
        validator_mounts: ["bench/xevid/agree.py:/xevid/agree.py:ro", "bench/xevid/bundles/{task.pid}:/xevid/bundle:ro"]
- name: replicate-cross
  team: teams/x-evid.yaml
  patches:
    runtime/x-evid.yaml:
      sandbox:
        validator_mounts: ["bench/xevid/agree.py:/xevid/agree.py:ro", "bench/xevid/bundles/{task.pid}:/xevid/bundle:ro"]
    harness/team-xevid-b.yaml: {model: mimo-v2.6-flash}
- name: compute-control
  team: teams/x-evid-control.yaml
owner:
  mode: auto-approve
  nudges: 0
  nudge_text: "-"
  max_rounds: 2
audit: .venv/bin/python bench/team/check.py {run} --json {out}
