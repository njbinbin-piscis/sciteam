name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check sciteam harness tests

      - name: ruff format --check
        run: ruff format --check sciteam harness tests

  example-plugin:
    name: example plugin (packaging + own tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sciteam (editable)
        run: python -m pip install -e .

      - name: Install sciteam-plugin-example (editable, dev extras)
        run: python -m pip install -e "examples/plugins/sciteam-plugin-example[dev]"

      - name: Run the example plugin's own tests
        working-directory: examples/plugins/sciteam-plugin-example
        run: python -m pytest -q
