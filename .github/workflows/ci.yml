name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ examples/ -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check sciteam harness tests plugins examples

      - name: ruff format --check
        run: ruff format --check sciteam harness tests plugins examples

  example-plugin:
    name: example plugin (packaging + own tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sciteam (editable)
        run: python -m pip install -e .

      - name: Install sciteam-plugin-example (editable, dev extras)
        run: python -m pip install -e "examples/plugins/sciteam-plugin-example[dev]"

      - name: Run the example plugin's own tests
        working-directory: examples/plugins/sciteam-plugin-example
        run: python -m pytest -q

  official-plugins:
    name: official plugins matrix (anthropic, deepseek, mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sciteam (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Install official plugins (editable)
        run: |
          python -m pip install -e plugins/sciteam-runtime-anthropic \
                                -e plugins/sciteam-runtime-deepseek \
                                -e plugins/sciteam-tool-mcp \
                                -e plugins/sciteam-sandbox-docker

      - name: Run plugin unit and integration tests
        run: |
          python -m pytest plugins/sciteam-runtime-anthropic/tests \
                           plugins/sciteam-runtime-deepseek/tests \
                           plugins/sciteam-tool-mcp/tests \
                           plugins/sciteam-sandbox-docker/tests \
                           tests/test_official_plugins.py \
                           tests/test_multi_backend_isomorphism.py -q

  clean-install:
    name: wheel install on a clean machine (no checkout on sys.path, no pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Install the wheel into a fresh venv (no dev extras)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl

      - name: Reproduce the paper's canonical run from an unrelated directory
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/venv/bin/sciteam"
          "$S" version
          "$S" env
          "$S" paradigms list
          "$S" plugins list
          "$S" demo --mode full --out ./run > full.json
          "$S" demo --mode full --config-swap > swap.json
          "$S" demo --mode prompt_only > prompt_only.json
          "$S" demo --mode no_separation > no_separation.json
          "$S" demo --mode no_recovery > no_recovery.json
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json
          def load(n): return json.load(open(n))
          full, swap = load("full.json"), load("swap.json")
          assert full["verdict"]["closed_legally"] is True and full["interpreter_hash_unchanged"]
          assert any("bystander" in l and "authorized=False" in l for l in full["log"])
          assert any("wrote authorized veto" in l for l in full["log"])
          assert swap["verdict"]["approval_rule"]["kind"] == "committee" and swap["verdict"]["closed_legally"] is True
          assert swap["interpreter_hash_before"] == full["interpreter_hash_before"]
          for n in ("prompt_only", "no_separation"):
              d = load(n + ".json")
              assert d["verdict"]["closed_legally"] is True and d["ground_truth_tests_actually_passed"] is False, n
          assert load("no_recovery.json")["verdict"]["closed_legally"] is False
          print("canonical truth table reproduced from a clean wheel install")
          PY

      - name: The canonical run's ledger must verify, and say what counted
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/venv/bin/sciteam"
          "$S" ledger verify ./run
          "$S" ledger show ./run
          "$S" ledger replay ./run > replay.json
          "$S" ledger resume-state ./run > resume_state.json
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json
          state = json.load(open("replay.json"))
          assert state["finished"] and state["effective_artifacts"]["m_implement"]["attempt"] == 2
          assert [a["seat"] for a in state["refused_acts"]] == ["bystander"]
          assert len(state["vetoes"]) == 1 and len(state["reopenings"]) == 1
          resume_state = json.load(open("resume_state.json"))
          assert resume_state["finished"] is True
          print("ledger replay and resume-state agree with the paper's five claims")
          PY

      - name: A tampered ledger must fail verification
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          sed -i.bak '5d' ./run/ledger.jsonl
          if "$RUNNER_TEMP/venv/bin/sciteam" ledger verify ./run; then
            echo "tamper detection FAILED: a deleted entry verified clean" >&2
            exit 1
          fi
          echo "tamper detected as expected"

      - name: Bundled institutions must survive no non-equivalent mutant
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          D=$("$RUNNER_TEMP/venv/bin/python" -c \
            "from sciteam._paths import ASSETS_ROOT; print(ASSETS_ROOT / 'teams' / 'paradigms')")
          "$RUNNER_TEMP/venv/bin/sciteam" mutate "$D"

      - name: Scaffold a project and verify its ledger view in a clean install
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/venv/bin/sciteam"
          "$S" init --list
          "$S" init approval_gate -t ./my_project
          "$S" validate ./my_project/institution.yaml
          "$S" mutate ./my_project/institution.yaml
          "$S" ledger view ./run -o ./view.html
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          from pathlib import Path
          html = Path("view.html").read_text()
          assert "CHAIN VERIFIED" in html and "artifact_submitted" in html
          assert "http://" not in html and "https://" not in html
          print("scaffolded project and standalone ledger view verified on clean machine")
          PY

      - name: Verify official plugins in a clean install
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/pip" install "$GITHUB_WORKSPACE/plugins/sciteam-runtime-anthropic" \
                                             "$GITHUB_WORKSPACE/plugins/sciteam-runtime-deepseek" \
                                             "$GITHUB_WORKSPACE/plugins/sciteam-tool-mcp" \
                                             "$GITHUB_WORKSPACE/plugins/sciteam-sandbox-docker"
          OUT=$("$RUNNER_TEMP/venv/bin/sciteam" plugins list)
          echo "$OUT"
          echo "$OUT" | grep -q "sciteam-runtime-anthropic"
          echo "$OUT" | grep -q "sciteam-runtime-deepseek"
          echo "$OUT" | grep -q "sciteam-tool-mcp"
          echo "$OUT" | grep -q "sciteam-sandbox-docker"
          echo "$OUT" | grep -q "mcp_probe"
          echo "$OUT" | grep -q "docker_sandbox_run"
          echo "official plugins verified in clean wheel install"
