id: debate_elo
name: Debate with Elo Ranking
description: Replica debaters argue candidates; Elo tournament ranks survivors.
members:
- key: debater
  agent_id: debater
  name: Technical Debater
  role: debater
- key: judge
  agent_id: judge
  name: Debate Judge
  role: judge
  emits_exit_artifact: true
- key: round_assessor
  agent_id: round_assessor
  name: Round Assessor
  role: round_assessor
  authority:
  - may_assess_round
coordination:
  topology: parallel
  scheduling:
    employment: true
    mode: barrier
    max_parallel: 4
  stopping:
    kind: judgment
    max_iterations: 200
  aggregation: elo_tournament
  replicas:
    debater: 3
  charter:
    standing_goal: Production seats deliver the mission; round_assessor judges round
      completion from observation facts. Fail-honest if no exit artifact by stagnation_max_rounds.
    stagnation_max_rounds: 8
