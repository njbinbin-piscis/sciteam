[project]
name = "sciteam-plugin-example"
version = "0.1.0"
description = "Reference SciTeam plugin — one paradigm, one tool, one hook. Demonstrates extending sciteam without touching sciteam/."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["sciteam"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."sciteam.plugins"]
example = "sciteam_plugin_example:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sciteam_plugin_example = ["paradigms/*.yaml"]
