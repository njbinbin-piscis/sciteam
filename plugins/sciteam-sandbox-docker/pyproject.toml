[project]
name = "sciteam-sandbox-docker"
version = "0.1.0"
description = "Official Docker container sandbox plugin for SciTeam"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["sciteam"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."sciteam.plugins"]
sandbox_docker = "sciteam_sandbox_docker:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
