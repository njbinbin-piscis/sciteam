id: minimal_judgment
name: Minimal Judgment Fixture
description: >
  Generic 1-producer + 1-assessor team for engine generalization tests.
  Not a science-domain paradigm.
members:
  - key: writer
    agent_id: writer
    name: Writer
    role: writer
    emits_exit_artifact: true
  - key: round_assessor
    agent_id: round_assessor
    name: Round Assessor
    role: round_assessor
    authority: [may_assess_round]
coordination:
  topology: loop
  scheduling:
    employment: true
    mode: barrier
    max_parallel: 1
  stopping:
    kind: judgment
    max_iterations: 8
  charter:
    standing_goal: >
      Writer emits the exit artifact. Assessor completes only when the file
      exists (and gate matches when declared). If no exit by round 2, fail
      with exit_stalled.
    stagnation_max_rounds: 2
